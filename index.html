<!doctype html>
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IQ2GQ Hub</title>
  <!-- Cache-busting is automatic: styles.css and app.js are loaded with a
       fresh timestamp on every page load, so a stale cached copy can never
       be served after an update - nothing here needs manual editing. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&display=swap" rel="stylesheet">
  <script>document.write('<link rel="stylesheet" href="styles.css?v=' + Date.now() + '">');</script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/iq2gq-logo.png" alt="IQ2GQ logo" class="logo">
      <div class="brand-text">
        <h1>IQ2GQ Hub</h1>
        <p class="status" id="status">Loading live Google Sheet data...</p>
      </div>
    </div>
  </header>

  <div class="site-toolbar" id="siteToolbar">
    <div class="toolbar-row">
      <nav class="nav" id="nav">
        <button class="tab active" data-page="dashboard">Dashboard</button>
        <button class="tab" data-page="pickassistant">Pick Assistant</button>
        <button class="tab" data-page="stats">Stats</button>
        <button class="tab" data-page="records">Records</button>
        <button class="tab" data-page="search">Search</button>
      </nav>
    </div>
  </div>

  <main id="app" class="main"></main>

  <!-- This label is just a human-readable changelog marker for spotting a
       successful deploy at a glance - it plays no role in cache-busting,
       which is fully automatic above. -->
  <footer class="footer">IQ2GQ Hub v3.7 - live from Google Sheets</footer>

  <script>document.write('<scri' + 'pt src="app.js?v=' + Date.now() + '"><\/scri' + 'pt>');</script>
</body>
</html>
