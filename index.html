<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IQ2GQ Hub</title>
  <!-- Cache-busting: bump ?v=X.X on styles.css, app.js and pickAssistant.js
       (and the footer below) every time any of those files change, or
       browsers may keep serving a stale cached copy after an update. -->
  <link rel="stylesheet" href="styles.css?v=2.1">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="assets/iq2gq-logo.png" alt="IQ2GQ logo" class="logo">
      <div class="brand-text">
        <h1>IQ2GQ Hub</h1>
        <p class="status" id="status">Loading live Google Sheet data...</p>
      </div>
    </div>
  </header>

  <div class="site-toolbar" id="siteToolbar">
    <div class="toolbar-row">
      <nav class="nav" id="nav">
        <button class="tab active" data-page="dashboard">Dashboard</button>
        <button class="tab" data-page="pickassistant">Pick Assistant</button>
        <button class="tab" data-page="stats">Stats</button>
        <button class="tab" data-page="records">Records</button>
        <button class="tab" data-page="search">Search</button>
      </nav>
      <div class="toolbar-controls">
        <div class="season-toggle" id="seasonToggle">
          <button class="season-btn active" data-season="all" type="button">All-time</button>
          <button class="season-btn" data-season="current" type="button">&#9679; Current season</button>
        </div>
        <details class="filters-toggle" id="filtersToggle">
          <summary id="filtersSummary">Filters <span class="chev">&#9662;</span></summary>
          <div class="filters" id="filtersPanel">
            <label>Member<select id="memberFilter"></select></label>
            <label>Sport group<select id="sportGroupFilter"></select></label>
            <label>Bet type<select id="betTypeFilter"></select></label>
            <label>Year<select id="yearFilter"></select></label>
            <label>Odds<select id="oddsFilter"></select></label>
            <label>Result<select id="resultFilter"></select></label>
            <label class="search-label">Search<input id="searchInput" placeholder="Warriors, Bunnings, McCaw..."></label>
            <label>Min picks<input id="minPicks" type="number" min="1" value="10"></label>
            <button id="resetBtn" type="button">Reset</button>
          </div>
        </details>
      </div>
    </div>
  </div>

  <main id="app" class="main"></main>

  <footer class="footer">IQ2GQ Hub v1.6 - live from Google Sheets</footer>

  <script src="app.js?v=2.1"></script>
  <script src="pickAssistant.js?v=2.1"></script>
</body>
</html>
