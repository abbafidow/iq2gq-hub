name: Update sports data

on:
  schedule:
    # Every day at 6am UTC (roughly 6pm NZ standard time / 7pm NZDT).
    # Change this if you'd rather it ran at a different time.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

# Stops two runs (e.g. the daily schedule and a manual trigger) from ever
# executing at the same time - without this, two overlapping runs can each
# read the file before either has pushed, independently think the same
# games are "new", and both add them - producing exact duplicate entries.
# A queued run waits for the current one to finish rather than running
# alongside it or cancelling it.
concurrency:
  group: update-sports-data
  cancel-in-progress: false

permissions:
  contents: write # needed so the workflow can commit the updated JSON files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run update script
        env:
          SPORTSDB_API_KEY: ${{ secrets.SPORTSDB_API_KEY }}
        run: node scripts/update-sports-data.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epl_full_match_history.json nfl_full_match_history.json nrl_full_match_history.json super_rugby_full_match_history.json afl_full_match_history.json npc_full_match_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update EPL/NFL/NRL/Super Rugby/AFL/NPC results from TheSportsDB"
            # Second layer of defense: pull any changes pushed by another
            # run in the meantime before pushing ours, so a near-miss
            # doesn't still slip through the concurrency guard above.
            git pull --rebase origin main
            git push
          fi
