name: Update sports data

on:
  schedule:
    # Every day at 6am UTC (roughly 6pm NZ standard time / 7pm NZDT).
    # Change this if you'd rather it ran at a different time.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab, for testing

permissions:
  contents: write # needed so the workflow can commit the updated JSON files back to the repo

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run update script
        run: node scripts/update-sports-data.js

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add epl_full_match_history.json nfl_full_match_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update EPL/NFL results from TheSportsDB"
            git push
          fi
